name: Deploy

# 1. CMS (Coolify): builds the image that serves the Payload admin and API,
#    pushes it to GHCR and asks Coolify to pull it. Pending database migrations
#    run when the new container starts (prodMigrations in payload/payload.config.ts).
# 2. Site (Vercel): deploys the storefront, which reads its content from the
#    CMS. It runs second because its build reads from the CMS just deployed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lunor-labs/aromavitae

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_ASSET_BASE_URL=${{ vars.NEXT_PUBLIC_ASSET_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

  site:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@58

      - name: Link Vercel project
        run: vercel link --yes --project=aromavitae --token=${{ secrets.VERCEL_TOKEN }}

      # Built on Vercel, not on the runner (`--prebuilt` uploads a build that
      # points at the runner's node_modules). CMS_URL is needed at build time to
      # render pages and at runtime to refresh them and for proxy.ts.
      - name: Deploy (Production)
        run: |
          vercel deploy --prod \
            --build-env CMS_URL="${{ vars.CMS_URL }}" \
            --build-env NEXT_PUBLIC_ASSET_BASE_URL="${{ vars.NEXT_PUBLIC_ASSET_BASE_URL }}" \
            --env CMS_URL="${{ vars.CMS_URL }}" \
            --token=${{ secrets.VERCEL_TOKEN }}
