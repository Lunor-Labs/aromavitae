name: Preview (Vercel)

# Every pull request into main gets a Vercel preview of the site, reading from
# the production CMS. Production deploys are in deploy.yml.
on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@58

      - name: Link Vercel project
        run: vercel link --yes --project=aromavitae --token=${{ secrets.VERCEL_TOKEN }}

      # See deploy.yml for why this builds on Vercel and passes CMS_URL twice.
      - name: Deploy (Preview)
        run: |
          vercel deploy \
            --build-env CMS_URL="${{ vars.CMS_URL }}" \
            --build-env NEXT_PUBLIC_ASSET_BASE_URL="${{ vars.NEXT_PUBLIC_ASSET_BASE_URL }}" \
            --env CMS_URL="${{ vars.CMS_URL }}" \
            --token=${{ secrets.VERCEL_TOKEN }}
