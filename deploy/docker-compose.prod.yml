# Coolify Docker Compose resource for the `aromavitae` project (production).
# Paste this into the resource's Compose editor — see docs/vps-deploy-setup.md
# Phase F. Actual values for the ${VAR} references below are set in Coolify's
# Environment Variables tab for this resource, not here.
#
# A future `dev` resource is the same file with `image:` pointed at the
# `:dev` tag instead of `:latest`.
services:
  api:
    image: ghcr.io/lunor-labs/aromavitae-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 4000
    ports:
      - "4000:4000"
