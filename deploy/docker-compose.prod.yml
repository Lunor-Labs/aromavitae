# Coolify Docker Compose resource for the `aromavitae` project (production).
# Paste this into the resource's Compose editor — see docs/vps-deploy-setup.md
# Phase F. Actual values for the ${VAR} references below are set in Coolify's
# Environment Variables tab for this resource, not here.
#
# NEXT_PUBLIC_ASSET_BASE_URL is not here: it is baked into the image at build
# time from the GitHub `prod` environment's variable of the same name.
services:
  web:
    image: ghcr.io/lunor-labs/aromavitae:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/admin/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      SERVER_URL: ${SERVER_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    expose:
      - "3000"
